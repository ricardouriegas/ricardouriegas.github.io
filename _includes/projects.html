<section class="projects-section">
  <div class="project-container">
    {% if include.featured %}
      {% assign projects = site.data.settings.featured_projects %}
    {% else %}
      {% assign projects = site.data.settings.projects %}
    {% endif %}
    {% for project in projects %}
      <a class="project-link" href="{{ site.github.url }}/projects/{{ project.url }}">
        <div class="project-unit project-unit-{{ forloop.index }}" data-project="{{ project.name }}">
          <div class="project-overlay">
            <strong>{{ project.name }} <i class="fa fa-arrow-right" aria-hidden="true"></i></strong>
          </div>
        </div>
      </a>
    {% endfor %}
  </div>
</section>
